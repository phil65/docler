#:tombi schema.strict = false

[project]
name = "docler"
version = "2.4.0"
description = "Unified async interface to OCR and document-AI services for converting documents to markdown"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Philipp Temminghoff", email = "philipptemminghoff@googlemail.com" },
]
keywords = [
  "azure-document-intelligence",
  "chunking",
  "docling",
  "document-conversion",
  "document-processing",
  "llm",
  "markdown",
  "mistral",
  "ocr",
  "pdf",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "anyenv[httpx2]>=2.1.0",
  "httpx2>=2.16",
  "mkdown>=1.0.2",
  "pydantic",
  "pydantic-settings>=2.8.1",
  # "pymupdf>=1.26.1",  # Temporarily disabled in favor of pypdf
  "pypdf",
  # Only add below (Copier)
  "schemez>=0.0.1",
  "typer>=0.12",
  "upathtools>=0.4.3",
]

[project.urls]
"Code coverage" = "https://app.codecov.io/gh/phil65/docler"
Documentation = "https://phil65.github.io/docler/"
Homepage = "https://github.com/phil65/docler"
Issues = "https://github.com/phil65/docler/issues"
Source = "https://github.com/phil65/docler"

[project.scripts]
docler = "docler.__main__:cli"

[project.optional-dependencies]
# marker is not part of `all`: marker-pdf requires openai<3 while agentpool (via
# pydantic-ai) requires openai>=3.31, so they cannot share an environment.
all = ["docler[azure,diffs,docling,llama-parse,markitdown,mcp,mistralai,openai,server]", "agentpool>=2.10.0"]
azure = ["azure-ai-documentintelligence"]
diffs = ["diff-match-patch"]
docling = ["docling[ocrmac,vlm,rapidocr]; python_version < '3.14'"]  # tesserocr
light = ["docler[mistralai,diffs,llama-parse,openai,azure]", "agentpool>=2.10.0"]
llama-parse = ["llama-parse; python_version < '3.14'"]
marker = ["marker-pdf; python_version < '3.14'"]
markitdown = ["markitdown[all]; python_version < '3.14'"]
mcp = ["fastmcp"]
mistralai = ["mistralai>=3"]
olmocr = ["olmocr; python_version < '3.14'", "accelerate; python_version < '3.14'"]
openai = ["openai"]
server = ["uvicorn", "fastapi"]
streamlit = [
  "streamlit; python_version < '3.14'",
  "streambricks; python_version < '3.14'",
]
token-chunking = ["tokonomics"]

[dependency-groups]
dev = [
  "deptry",
  "devtools",
  "pyreadline3",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  # Only add below (Copier)
  "pytest-docker>=3.2.1",
  "syrupy>=4.9.1",
]
benchmark = ["pyinstrument"]
docs = [
  "mkdocs-mknodes>=2.1.0",
  "mkdocstrings[python]",
  # Only add below (Copier)
]
lint = [
  # Pinned on purpose: CI, pre-commit and editors all run exactly these versions.
  # Bump them here (template) and roll out via `copier update`.
  "ruff==0.17.6",
  "ty==0.0.107",
  # Only add below (Copier)
]

[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError",
  'if __name__ == "__main__":',
]

[tool.mknodes]
allowed-commit-types = [
  "fix",
  "feat",
  "refactor",
  "docs",
  "test",
  "build",
  "chore",
]
docstring-style = "google"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "basic"
deprecateTypingAliases = true
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnknownVariableType = false
reportAny = false
reportImplicitOverride = false
reportUnusedFunction = false
reportImplicitStringConcatenation = false
reportIgnoreCommentWithoutRule = false
reportUnannotatedClassAttribute = false
reportSelfClsParameterName = false
reportPrivateImportUsage = false

[tool.pytest]
log_cli = true
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s %(levelname)s %(message)s"
minversion = "9.0"
testpaths = ["tests/"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py313"

[tool.ruff.lint]
future-annotations = true
select = [
  "A",  # Flake8-builtins
  # "ANN",  # Flake8-Annotations
  # "ASYNC",  # Flake8-Async
  # "ARG",  # # Flake8-Unused-Arguments
  "B",  # flake8-bugbear
  "BLE",  # Flake8-blind-except
  "C",
  "C4",  # flake8-comprehensions
  # "C90",  # MCCabe
  "COM",  # Flake8-commas
  # "CPY",  #  Copyright-related rules
  "D",  # PyDocStyle
  # "DTZ",  # Flake8- Datetimez
  "E",  # PyCodeStyle Error
  "EM",  # flake8-errmsg
  # "ERA",  #  Eradicate
  "EXE",  # flake8-executable
  "F",  # PyFlakes
  "FA",  # flake8-future-annotations
  # "FBT",  # flake8-boolean-trap
  # "FIX",  # flake8-fixme
  "FLY",  # flynt
  "G",  # flake8-logging-format
  "I",  # ISort
  "ICN",  # Flake8-import-conventions
  "INP",  # flake8-no-pep420
  "INT",  # flake8-gettext
  "ISC",  # flake8-implicit-str-concat
  "N",  # pep8-naming
  # "NPY",  # numpy-specific rules
  # "PD",   # pandas-vet
  "PERF",  # perflint
  # "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PLE",  # PyLint Error
  "PLC",  # PyLint convention
  # "PLW",  # PyLint Warning
  "PLR",  # PyLint refactor
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",  # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific rules
  # "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "SLOT",  # flake8-slots
  # "T",
  # "TD",   # flake8-todos
  "T10",  # flake8-debugger
  # "T20",  # flake8-print
  "TC",  # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",  # PyUpgrade
  "W",  # PyCodeStyle warning
  "YTT",  # flake8-2020
]
ignore = [
  "C408",  # Unnecessary {obj_type} call (rewrite as a literal)
  "B905",  # zip() without an explicit strict= parameter
  "C901",  # {name} is too complex ({complexity} > {max_complexity})
  "COM812",
  # "CPY001", # Missing copyright notice at top of file
  "D100",  # Missing docstring in public module
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D106",  # Missing docstring in public nested class
  "D107",  # Missing docstring in __init__
  "D203",  # 1 blank line required before class docstring
  "D204",  # 1 blank line required after class docstring
  "D213",  # Multi-line docstring summary should start at the second line
  "D215",  # Section underline is over-indented ("{name}")
  "D400",  # First line should end with a period
  "D401",  # First line of docstring should be in imperative mood: "{first_line}"
  "D404",  # First word of the docstring should not be "This"
  "D406",  # Section name should end with a newline ("{name}")
  "D407",  # Missing dashed underline after section ("{name}")
  "D408",  # Section underline should be in the line following the section's name ("{name}")
  "D409",  # Section underline should match the length of its name ("{name}")
  "D413",  # Missing blank line after last section ("{name}")
  "EM101",  # Exception must not use a string literal, assign to variable first
  "EM102",  # Exception must not use an f-string literal, assign to variable first
  "ISC001",
  "PLC0415",
  "PLR0912",  # Too many branches
  "PLR0913",  # Too many arguments to function call
  "PLR0915",  # Too many statements
  "PLR0917",  # Too many positional arguments
  # "PLR2004", # Magic values instead of named consts
  "SLF001",  # Private member accessed
  "TRY003",  # Avoid specifying long messages outside the exception class
  "TC006",  # runtime-cast-value
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
  "schemez.Schema",
  "sqlmodel.SQLModel",
]
runtime-evaluated-decorators = [
  "pydantic.validate_call",
  "fastapi.FastAPI.get",
  "fastapi.FastAPI.post",
  "fastmcp.FastMCP.tool",
  "typer.Typer.command",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
# lines-between-types = 1
# atomic = true
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "I001"]
"scripts/*" = ["INP001"]
"*tests/*" = ["D100"]

[tool.ruff.format]
preview = true

[tool.ty.src]
# `ty check` (hooks, CI, editors) type-checks the package code only.
include = ["src"]

[tool.ty.environment]
python-version = "3.13"
python-platform = "all"

[tool.ty.analysis]
# Optional provider extras that CI does not install (docling pulls in torch;
# marker cannot share an environment with `all`), or that are only available
# below Python 3.14 (llama-parse, numpy via docling). Checked wherever installed.
allowed-unresolved-imports = [
  "docling.**",
  "docling_core.**",
  "llama_index.**",
  "llama_parse.**",
  "marker.**",
  "markitdown.**",
  "numpy.**",
  "streambricks.**",
  "streamlit.**",
]

[tool.ty.rules]
# Narrowing an overridden class attribute (e.g. pydantic discriminators,
# `Config` attributes) is an intentional pattern.
incompatible-mutable-override = "ignore"

[tool.uv]
default-groups = ["dev", "lint", "docs"]
# marker-pdf (openai<3) and agentpool (openai>=3.31) cannot be installed together.
conflicts = [
  [{ extra = "marker" }, { extra = "all" }],
  [{ extra = "marker" }, { extra = "light" }],
]

[tool.uv.build-backend]
module-name = [
  "docler",
  "docler_config",
  "docler_streamlit",
  "docler_api",
  "docler_mcp",
]

wheel-exclude = [
  ".mypy_cache/**",
  "__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".pytest_cache/**",
  ".ruff_cache/**",
]

source-exclude = [
  ".mypy_cache/**",
  "__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".pytest_cache/**",
  ".ruff_cache/**",
]
